name: check

# The whole suite is stdlib-only and runs in seconds, so there is no reason for
# it not to gate every change. `make check` is the same command a contributor
# runs locally — no CI-only steps, nothing that passes here and fails there.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the README promises. Testing only the newest
        # version would let a 3.11+ syntax feature break that promise silently.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: No third-party dependencies
        # The README's central claim about this tool is that installing it pulls
        # nothing. `pyproject.toml` now exists on purpose (it is what makes
        # `pip install` work at all), so file-absence stopped being the right
        # proof. This proves the stronger, and now correct, invariant: nothing
        # is DECLARED, not merely that no manifest file is PRESENT. See
        # tests/deps_test.py's module docstring for the vacuous-pass hole a
        # weaker check would reopen.
        run: python3 -m tests.deps_test --ci

      - name: make check
        run: make check

      - name: Invariant sweep over the checkout itself
        # Not a false-positive benchmark — that one needs a corpus of trusted
        # extensions, which a runner does not have. This asks the other
        # question: is the OUTPUT well-formed on a real tree.
        run: make anomalies CORPUS=.
